[project]
name = "qmdc-model"
version = "0.3.0"
description = "Metamodel operator and linter for QMD workspaces"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "umaxfun", email = "umaxfun@gmail.com" },
]
keywords = ["qmd", "metamodel", "linter", "schema", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "qmdc>=2.0.1,<3",
]

[project.urls]
Homepage = "https://github.com/mikilabs/qmdc-model"
Repository = "https://github.com/mikilabs/qmdc-model"
Issues = "https://github.com/mikilabs/qmdc-model/issues"

[project.scripts]
qmdc-model = "qmdc_model.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmdc_model"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
