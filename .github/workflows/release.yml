# Releases, one button: Actions -> Release -> Run workflow (pick patch, minor, major,
# or none to release the version already in pyproject.toml). It runs the full CI
# matrix, bumps pyproject.toml + uv.lock on main, tags vX.Y.Z, publishes to PyPI and
# creates a GitHub release. Pushing a tag vX.Y.Z that matches pyproject.toml does the
# same for that commit, without the bump.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, none]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: write   # push the bump commit, the tag and the GitHub release
      id-token: write   # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: astral-sh/setup-uv@v6

      - name: Bump, commit and tag (button)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.bump }}" != none ]; then
            python3 scripts/bump_version.py "${{ inputs.bump }}"
            uv lock
          fi
          version=$(uv version --short)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists; pick a bump"
            exit 1
          fi
          git config user.name "qmdc-model release"
          git config user.email "release@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore(release): bump qmdc-model to $version"
          fi
          git tag "v$version"
          git push origin HEAD:refs/heads/main "refs/tags/v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Tag must match pyproject version (tag push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        shell: bash
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        # A UV_PUBLISH_TOKEN secret is used when set; otherwise Trusted Publishing.
        # --check-url skips files already on PyPI, so re-running a release is safe.
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then unset UV_PUBLISH_TOKEN; fi
          uv publish --check-url https://pypi.org/simple/

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --title "qmdc-model $VERSION" --generate-notes \
            || gh release upload "v$VERSION" dist/* --clobber
